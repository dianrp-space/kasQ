# Contoh konfigurasi Nginx untuk KasQ (aaPanel)
# Tempel ke: Website → domain → Config, DI DALAM block server { ... }
#
# PENTING aaPanel:
# - JANGAN pakai try_files / index.html — bukan SPA static, semua route ke Node (PM2 :3008)
# - Comment/hapus baris aaPanel: error_page 404 /404.html;  (itulah sumber log [404] GET /404.html)
# - Pastikan location /api/ dan location / di bawah ini ADA dan tidak ketimpa config PHP/static

client_max_body_size 10m;

location /api/ {
	proxy_pass http://127.0.0.1:8084;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 300s;
	proxy_connect_timeout 60s;
}

location / {
	proxy_pass http://127.0.0.1:3008;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_buffering off;
}
