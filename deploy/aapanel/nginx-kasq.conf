# Contoh konfigurasi Nginx untuk KasQ (aaPanel)
# Tempel ke: Website → domain → Config, DI DALAM block server { ... }
#
# PENTING aaPanel (penyebab 404 _app/*.js dan halaman "Memuat..." doang):
# - aaPanel punya location ~ .*\.(js|css|...)$ yang MENANG dari location / biasa
# - Akibatnya /_app/immutable/*.js dicari di folder static site → 404
# - Solusi: location ^~ /_app/ di bawah (stop regex) ATAU comment block static js/css aaPanel
# - JANGAN pakai try_files / index.html — bukan SPA static
# - Comment: error_page 404 /404.html;

client_max_body_size 10m;

location ^~ /api/ {
	proxy_pass http://127.0.0.1:8084;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 300s;
	proxy_connect_timeout 60s;
}

# Wajib ^~ — asset SvelteKit; kalau tidak, aaPanel regex *.js menang
location ^~ /_app/ {
	proxy_pass http://127.0.0.1:3008;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_buffering off;
}

location / {
	proxy_pass http://127.0.0.1:3008;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_buffering off;
}
