# Values live in the GitHub Environment named `.deploy.env`
# (Settings → Environments). Same secret/variable names as deploy/deploy.env locally.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy target
        type: choice
        options:
          - all
          - backend
          - frontend
        default: all

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: .deploy.env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare deploy.env & SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL || vars.DEPLOY_PUBLIC_URL }}
          DEPLOY_RUN_USER: ${{ secrets.DEPLOY_RUN_USER || vars.DEPLOY_RUN_USER }}
          DEPLOY_FRONTEND: ${{ secrets.DEPLOY_FRONTEND || vars.DEPLOY_FRONTEND }}
          DEPLOY_PM2_USER: ${{ secrets.DEPLOY_PM2_USER || vars.DEPLOY_PM2_USER }}
          DEPLOY_PM2_BIN: ${{ secrets.DEPLOY_PM2_BIN || vars.DEPLOY_PM2_BIN }}
          DEPLOY_PM2_APP_NAME: ${{ secrets.DEPLOY_PM2_APP_NAME || vars.DEPLOY_PM2_APP_NAME }}
          DEPLOY_RESTART: ${{ secrets.DEPLOY_RESTART || vars.DEPLOY_RESTART }}
          DEPLOY_GOOS: ${{ secrets.DEPLOY_GOOS || vars.DEPLOY_GOOS }}
          DEPLOY_GOARCH: ${{ secrets.DEPLOY_GOARCH || vars.DEPLOY_GOARCH }}
          DEPLOY_STRIP_SOURCEMAPS: ${{ secrets.DEPLOY_STRIP_SOURCEMAPS || vars.DEPLOY_STRIP_SOURCEMAPS }}
          DEPLOY_RSYNC_COMPRESS: ${{ secrets.DEPLOY_RSYNC_COMPRESS || vars.DEPLOY_RSYNC_COMPRESS }}
          DEPLOY_PARALLEL_BUILD: ${{ secrets.DEPLOY_PARALLEL_BUILD || vars.DEPLOY_PARALLEL_BUILD }}
          DEPLOY_SSH_KEY_CONTENT: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_ONLY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_only || '' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST in Environment .deploy.env}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER in Environment .deploy.env}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH in Environment .deploy.env}"
          : "${DEPLOY_SSH_KEY_CONTENT:?Missing DEPLOY_SSH_KEY in Environment .deploy.env}"

          mkdir -p .ssh deploy
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY_CONTENT" > .ssh/id_deploy
          chmod 600 .ssh/id_deploy

          export DEPLOY_SSH_KEY="${GITHUB_WORKSPACE}/.ssh/id_deploy"
          export DEPLOY_ONLY="${DEPLOY_ONLY_INPUT:-all}"
          export DEPLOY_SKIP_NPM_CI=false

          sed -i 's/\r$//' deploy/write-deploy-env.sh
          bash deploy/write-deploy-env.sh

          set -a
          # shellcheck disable=SC1091
          source deploy/deploy.env
          set +a
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          port="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$port" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        run: |
          set -euo pipefail
          sed -i 's/\r$//' deploy/deploy.sh
          bash deploy/deploy.sh
